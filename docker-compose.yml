services:
  onfg_gunshot_classifier:
    build:
      context: .
      dockerfile: Dockerfile
    image: onfg_gunshot_classifier:latest
    shm_size: '2gb'  # <--- Augmente la mémoire partagée ici
    container_name: onfg_gunshot_classifier
    restart: no
    working_dir: /app
    volumes:
      - ./src:/app
      # Si besoin, remplacez le chemin ci-dessous par le chemin sur le périphérique contenant les fichiers audio à analyser
      - ./audio_to_analyze:/data/audio
      # Exemple (si fichiers présents dans E:/...) - /mnt/e/...:/data/audio
      # Les fichiers .wav doivent être placés à la racine de ce dossier pour être analysés
      - ./results:/data/results
    environment:
      - PYTHONUNBUFFERED=1
    tty: true
    command: bash
